name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            archive: motivator-aarch64-macos.tar.gz
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            archive: motivator-x86_64-macos.tar.gz
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: motivator-x86_64-linux.tar.gz
          - name: Windows (x86_64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            archive: motivator-x86_64-windows.zip
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The release tag must match the version committed in Cargo.toml — the
      # binary reports the Cargo version, so a mismatch would ship a lie.
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag $VERSION != Cargo.toml $CARGO_VERSION — bump Cargo.toml first" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install eframe system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            7z a "../../../${{ matrix.archive }}" motivator.exe
          else
            tar czf "../../../${{ matrix.archive }}" motivator
          fi

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: 'motivator ${{ github.ref_name }}'
          body: |
            A friend in the corner of your desktop — speech-bubble nudges,
            learnable quotes, photo avatars that talk, and chat in their voice
            via any OpenAI-compatible endpoint.

            Downloads below: `.tar.gz` (macOS / Linux), `.zip` (Windows).
            Single static-ish binary — unpack and run. Builds are unsigned;
            on macOS use `xattr -d com.apple.quarantine motivator` after
            unpacking.
          files: ${{ matrix.archive }}

  homebrew:
    name: Update Homebrew cask
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: token
        run: echo "have=${{ secrets.HOMEBREW_TAP_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Compute macOS archive checksums
        if: steps.token.outputs.have == 'true'
        id: sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*-macos.tar.gz'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arm=$(sha256sum motivator-aarch64-macos.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum motivator-x86_64-macos.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        if: steps.token.outputs.have == 'true'
        uses: actions/checkout@v7
        with:
          repository: gitu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump cask
        if: steps.token.outputs.have == 'true'
        run: |
          cd tap
          sed -i \
            -e 's/^  version ".*"$/  version "${{ steps.sums.outputs.version }}"/' \
            -e 's/^  sha256 arm:   ".*",$/  sha256 arm:   "${{ steps.sums.outputs.arm }}",/' \
            -e 's/^         intel: ".*"$/         intel: "${{ steps.sums.outputs.intel }}"/' \
            Casks/motivator.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/motivator.rb
          git diff --cached --quiet || git commit -m "motivator ${{ steps.sums.outputs.version }}"
          git push
