[package]
name = "motivator"
# Placeholder — release builds get the real version from the git tag (release.yml).
version = "0.0.0"
edition = "2021"
description = "a friend in the corner of your desktop. it says the things they'd actually say."
license = "MIT"
repository = "https://github.com/gitu/motivator"
readme = "README.md"

[dependencies]
auto-launch = "0.6"
eframe = "0.35"
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ureq = { version = "3", features = ["json"] }
rfd = "0.17"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2"
rustface = "0.1.7"
tract-onnx = "0.23"

[profile.release]
lto = true
strip = true

# neural matting (tract) is unusably slow unoptimized — keep only our own
# crate debuggable in dev/test builds
[profile.dev.package."*"]
opt-level = 2
